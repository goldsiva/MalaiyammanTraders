  <title>Gallery - Malaiyamman Traders</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 20px; }
    .gallery img { width: 100%; border-radius: 8px; cursor: pointer; transition: transform 0.3s; }
    .gallery img:hover { transform: scale(1.05); }
    .lightbox { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; flex-direction: column; text-align: center; }
    .lightbox img { max-width: 90%; max-height: 70%; border-radius: 8px; }
    .lightbox.active { display: flex; }
    .caption { color: #fff; margin-top: 15px; font-size: 18px; font-weight: bold; }
    .close, .prev, .next { position: absolute; top: 50%; transform: translateY(-50%); font-size: 40px; color: white; cursor: pointer; }
    .close { top: 20px; right: 30px; font-size: 30px; transform: none; }
    .prev { left: 30px; }
    .next { right: 30px; }
  </style>
</head>

  <section>
    <h2>Our Crackers Collection</h2>

      <img src="images/sparklers.jpg" alt="Sparklers" data-caption="Sparklers">
      <img src="images/flowerpots.jpg" alt="Flower Pots" data-caption="Deluxe Flower Pots">

  <script>
    const galleryImages = document.querySelectorAll('.gallery img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    const caption = lightbox.querySelector('.caption');
    const closeBtn = lightbox.querySelector('.close');
    const prevBtn = lightbox.querySelector('.prev');
    const nextBtn = lightbox.querySelector('.next');
    let currentIndex = 0;
    function showImage(index) {
      currentIndex = index;
      lightboxImg.src = galleryImages[index].src;
      caption.textContent = galleryImages[index].dataset.caption;
      lightbox.classList.add('active');
    }
